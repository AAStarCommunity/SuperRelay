# Fly.io configuration for Rundler ERC-4337 Bundler
# This configures deployment of a complete Rundler node on Fly.io

app = "rundler-superrelay"
primary_region = "sin"  # Singapore - closer to your location

[build]
  dockerfile = "Dockerfile"

[env]
  # Logging configuration
  RUST_LOG = "info"
  LOG_JSON = "true"
  
  # Network defaults (can be overridden by secrets)
  NETWORK = "ethereum_sepolia"
  
  # Server configuration
  METRICS_HOST = "0.0.0.0"
  METRICS_PORT = "8080"
  
  # Performance tuning for Fly.io
  MAX_VERIFICATION_GAS = "5000000"
  TARGET_BUNDLE_TRANSACTION_GAS_LIMIT_RATIO = "0.5"
  MAX_BUNDLE_TRANSACTION_GAS_LIMIT_RATIO = "0.9"

  # Gas fee optimization - reduce insufficient fee errors
  MIN_PRIORITY_FEE_PER_GAS = "1000000000"  # 1 Gwei minimum priority fee
  MAX_FEE_PER_GAS_OVERHEAD = "20000000000"  # 20 Gwei overhead for max fee
  GAS_FEE_ESTIMATION_BUFFER = "1.1"  # 10% buffer for fee estimation

  # Connection timeouts optimized for cloud deployment
  PROVIDER_CLIENT_TIMEOUT_SECONDS = "30"
  TRACER_TIMEOUT = "15s"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
  
  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 100

# Metrics endpoint accessible via internal port 8080
# Health checks handle metrics monitoring

# Resource allocation
[vm]
  memory = "1gb"    # Reduced from 2GB for cost optimization
  cpu_kind = "shared"
  cpus = 1          # Reduced from 2 for cost optimization

# Health checks
[checks]
  [checks.rundler_health]
    port = 8080
    type = "http"
    interval = "15s"
    timeout = "10s"
    grace_period = "30s"
    path = "/health"

  [checks.rpc_ready]
    port = 3000
    type = "http"
    interval = "30s"
    timeout = "10s"
    grace_period = "60s"
    path = "/"
    method = "POST"
    headers = {"Content-Type" = "application/json"}
    body = '{"jsonrpc":"2.0","method":"web3_clientVersion","params":[],"id":1}'

# Auto-scaling configuration
[scaling]
  min_machines_running = 0  # Auto-stop when idle for cost optimization
  max_machines_running = 1  # Single machine for minimal cost

# Process groups for different Rundler components (optional split deployment)
[processes]
  app = "node --rpc.port 3000 --rpc.host 0.0.0.0 --metrics.port 8080 --metrics.host 0.0.0.0"

# Alternative: Split into separate services (uncomment if needed)
